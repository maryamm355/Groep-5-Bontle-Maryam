<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main id="mobilewrap">
        <section id="container">

            <header class="score">
                <p>
                    <span class="title">Score</span>
                    <span class="scorefield">0</span>
                </p>
            </header>

            <aside class="newgame">
                <button class="button" type="button">New Game</button>
            </aside>

            <section class="grid" aria-label="2048 speelveld">
                <article class="row">
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                </article>
                <article class="row">
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                </article>
                <article class="row">
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                </article>
                <article class="row">
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                    <span class="base"></span>
                </article>
            </section>

            <section class="tiles" aria-hidden="true"></section>

            <section class="over" hidden>
                <p>Game Over</p>
            </section>

            <section class="won" hidden>
                <p class="winner">Je wint!</p>
                <p class="bestscore">BESTE SCORE: <span class="numbest"></span></p>
            </section>

        </section>
    </main>
</body>
</html>
