<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Classic Snake</h1>
  <p id="score">Score: 0</p>

  <section id="game-wrap">
    <canvas id="canvas" width="400" height="400"></canvas>

    <aside id="zijkant">
      <p class="zij-titel">Slang kleur</p>
      <button class="kleur-btn" style="background:#1b5e20" onclick="setKleur('#1b5e20', '#2e7d32')">Groen</button>
      <button class="kleur-btn" style="background:#1565c0" onclick="setKleur('#1565c0', '#1976d2')">Blauw</button>
      <button class="kleur-btn" style="background:#6a1b9a" onclick="setKleur('#6a1b9a', '#7b1fa2')">Paars</button>
      <button class="kleur-btn" style="background:#b71c1c" onclick="setKleur('#b71c1c', '#c62828')">Rood</button>
      <button class="kleur-btn" style="background:#e65100" onclick="setKleur('#e65100', '#ef6c00')">Oranje</button>
      <button class="kleur-btn" style="background:#212121" onclick="setKleur('#212121', '#424242')">Zwart</button>
    </aside>
  </section>

  <script src="script.js"></script>
</body>
</html>
