<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Says</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Simon Says</h1>
  <p id="score">Ronde: 0</p>
  <p id="message">Druk op Start om te spelen</p>

  <section id="game-wrap">
    <section id="simon">
      <button class="knop" id="rood"   data-index="0"></button>
      <button class="knop" id="blauw"  data-index="1"></button>
      <button class="knop" id="groen"  data-index="2"></button>
      <button class="knop" id="geel"   data-index="3"></button>
      <button class="knop" id="paars"  data-index="4"></button>
    </section>
  </section>

  <button id="start" onclick="startGame()">Start</button>

  <script src="script.js"></script>
</body>
</html>
